name: Release full suite

on:
  pull_request:
    branches: [claude/release-v0.6.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Full Python suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test]'
      - name: Isolate the doctor's privilege probe
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/synthe-test-bin"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/synthe-test-bin/sudo"
          chmod +x "$RUNNER_TEMP/synthe-test-bin/sudo"
          echo "$RUNNER_TEMP/synthe-test-bin" >> "$GITHUB_PATH"
      - name: Run every collected Python test (including mutations)
        run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONPATH: src

  plugin:
    name: OpenClaw plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --test
        working-directory: integrations/openclaw/plugin

  export:
    name: Public export scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export this exact ref into a disposable git directory
        if: ${{ hashFiles('scripts/export_public.py') != '' }}
        shell: bash
        run: |
          git init "$RUNNER_TEMP/synthe-public-export"
          python scripts/export_public.py "$RUNNER_TEMP/synthe-public-export" --ref HEAD
      # Scan failures are blocking. Human review is still required before publication.
      # The exporter stays private; an exported public copy skips this internal step.
