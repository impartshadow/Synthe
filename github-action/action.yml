name: 'Handoff Contract Check'
description: >-
  Validate an agent-to-agent handoff packet (Handoff Contract v0.1) before a
  receiving agent starts work. Fails the step when the handoff is rejected
  (stale, incomplete, blocked, duplicate, ...) and prints the reason.
  Two phases: `claim` checks the packet and records a RESERVED claim in a
  cache-persisted ledger; after the receiving agent's effect is real, a
  separate `complete` invocation flips the claim to COMPLETED.
author: 'Synthe'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  packet:
    description: 'Path to the handoff packet JSON (e.g. handoff.json committed in the PR).'
    required: true
  registry:
    description: 'Path to the agent registry JSON (canonical agent ids + aliases). Optional but recommended.'
    required: false
    default: ''
  ledger:
    description: >-
      Path to an idempotency ledger JSON for duplicate-handoff detection.
      Leave empty to use the Action-managed ledger at .synthe/ledger.json:
      on GitHub-hosted runners the workspace is thrown away after every run,
      so a plain ledger file would silently lose duplicate protection. The
      Action restores .synthe/ledger.json from actions/cache before the
      run and saves it back afterwards, chaining each run to the previous
      run's saved ledger (see github-action/README.md for the required
      workflow `concurrency` group that makes this exactly-one-safe).
      If you set this input, you manage that file's persistence yourself
      and the cache steps are skipped.
    required: false
    default: ''
  workspace:
    description: 'Workspace root used to check that referenced artifacts exist and match their hashes.'
    required: false
    default: '.'
  phase:
    description: >-
      `claim` (default): validate the packet and record the idempotency
      claim as RESERVED in the ledger. Run this BEFORE the receiving
      agent acts. `complete`: after the receiving agent's effect is
      real, flip the claim from RESERVED to COMPLETED. Invoke this Action
      a second time with the same packet/registry/ledger inputs and
      phase: complete. The two phases exist because the cache save in
      v0.2 ran before the effect, so a later COMPLETED flip was never
      persisted; each phase now restores, mutates, and re-saves the
      ledger itself.
    required: false
    default: 'claim'
  ledger-hmac-key:
    description: >-
      HMAC key sealing the ledger's integrity chain (SYNTHE_LEDGER_HMAC_KEY).
      Pass a CI secret, e.g. ${{ secrets.SYNTHE_LEDGER_HMAC_KEY }}. Without it
      the seal detects accidental corruption only, not forgery by someone who
      can write the ledger file. Rotate via secrets plus the previous value;
      see github-action/README.md.
    required: false
    default: ''
  ledger-anchor:
    description: >-
      The current out-of-cache anchor: pass ${{ vars.SYNTHE_LEDGER_ANCHOR }}.
      The restored ledger chain must match or extend it, so a stale cache
      restore or a deleted ledger fails closed. Reading it this way needs no
      token. Empty means no anchor has been published yet (first run).
    required: false
    default: ''
  anchor-token:
    description: >-
      Token that can write the SYNTHE_LEDGER_ANCHOR repository variable, used
      to publish the new chain head after each run (and to read it when
      ledger-anchor is not passed). GITHUB_TOKEN cannot do this: workflow
      permissions have no repository-variables scope. Use a fine-grained
      personal access token or a GitHub App token with "Variables: read and
      write" on this repository, stored as a secret. Without it, rollback
      detection is disabled (the chain seal still guards corruption) and a
      warning is logged.
    required: false
    default: ''
  ledger-bootstrap:
    description: >-
      Set to 'true' for exactly one run to re-bootstrap the ledger chain after
      a total cache eviction or an operator-declared reset: anchor enforcement
      is skipped once, a fresh genesis chain is sealed, and the anchor is
      republished. Default 'false'.
    required: false
    default: 'false'

outputs:
  decision:
    description: 'ACCEPT, REJECT, or (phase: complete) COMPLETED'
    value: ${{ steps.phase.outputs.decision }}

runs:
  using: 'composite'
  steps:
    # Ledger chaining: hosted runners are ephemeral, so the ledger is
    # restored from actions/cache before the phase and saved back after
    # it. The save key is unique per run AND per phase (cache entries
    # are immutable: when claim and complete shared one save key, the
    # complete phase's save silently lost to the claim phase's earlier
    # save in the same run and the COMPLETED flip was never persisted).
    # Restore uses prefix fallback, so each phase restores the NEWEST
    # snapshot: the complete phase in the same run sees this run's
    # claim save, and the next run sees the completed snapshot.
    # Exactly-one safety across runs additionally requires the caller workflow to serialize runs with a
    # `concurrency` group (documented in github-action/README.md): the
    # cache alone cannot order two runs that restore the same snapshot.
    # Skipped entirely when the caller supplies their own ledger path.
    - name: Restore handoff ledger
      if: inputs.ledger == ''
      uses: actions/cache/restore@v4
      with:
        path: .synthe/ledger.json
        key: synthe-ledger-${{ github.repository }}
        restore-keys: |
          synthe-ledger-${{ github.repository }}
    # Out-of-cache anchor: the last published chain head, stored as the
    # SYNTHE_LEDGER_ANCHOR repository variable (NOT in actions/cache, so a
    # stale cache restore is detectable). The checker requires the restored
    # ledger to match or extend this anchor; anything older, divergent, or
    # missing fails closed. A 404 means no anchor was ever published (first
    # run with anchoring): the checker seals a genesis chain. Any other
    # fetch failure fails the workflow rather than running unanchored.
    # Skipped when the caller supplies their own ledger path or no token.
    - name: Fetch ledger anchor
      if: inputs.ledger == '' && (inputs.anchor-token != '' || inputs.ledger-anchor != '')
      shell: bash
      env:
        ANCHOR_TOKEN: ${{ inputs.anchor-token }}
        ANCHOR_VALUE: ${{ inputs.ledger-anchor }}
      run: |
        set -u
        if [ -n "$ANCHOR_VALUE" ]; then
          case "$ANCHOR_VALUE" in
            *$'\n'*|*$'\r'*) echo "::error::ledger-anchor must be a single line"; exit 1 ;;
          esac
          {
            echo "SYNTHE_LEDGER_ANCHOR=${ANCHOR_VALUE}"
            echo "SYNTHE_LEDGER_ANCHOR_REQUIRED=1"
          } >> "$GITHUB_ENV"
          echo "Ledger anchor read from the ledger-anchor input; the restored ledger must match or extend it."
          exit 0
        fi
        if [ -z "$ANCHOR_TOKEN" ]; then
          echo "No ledger anchor published yet (ledger-anchor is empty); a genesis chain will be sealed."
          exit 0
        fi
        resp="$(mktemp)"
        code="$(curl -sS -o "$resp" -w '%{http_code}' \
          -H "Authorization: Bearer ${ANCHOR_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/variables/SYNTHE_LEDGER_ANCHOR")"
        if [ "$code" = "200" ]; then
          value="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["value"])' "$resp")"
          case "$value" in
            *$'\n'*|*$'\r'*) echo "::error::SYNTHE_LEDGER_ANCHOR must be a single line"; exit 1 ;;
          esac
          {
            echo "SYNTHE_LEDGER_ANCHOR=${value}"
            echo "SYNTHE_LEDGER_ANCHOR_REQUIRED=1"
          } >> "$GITHUB_ENV"
          echo "Ledger anchor fetched; the restored ledger must match or extend it."
        elif [ "$code" = "404" ]; then
          echo "No ledger anchor published yet (first run with anchoring); a genesis chain will be sealed."
        else
          echo "::error::Could not fetch the ledger anchor (HTTP $code); refusing to run without it."
          head -c 500 "$resp"
          rm -f "$resp"
          exit 1
        fi
        rm -f "$resp"
    - id: phase
      shell: bash
      env:
        HANDOFF_PACKET: ${{ inputs.packet }}
        HANDOFF_REGISTRY: ${{ inputs.registry }}
        HANDOFF_LEDGER: ${{ inputs.ledger != '' && inputs.ledger || '.synthe/ledger.json' }}
        HANDOFF_WORKSPACE: ${{ inputs.workspace }}
        # Selects claim (run_check.sh) vs complete (run_complete.sh).
        HANDOFF_PHASE: ${{ inputs.phase }}
        # Integrity binding: HMAC key for the chain seal (CI secret), and the
        # one-run bootstrap flag. The anchor itself arrives via GITHUB_ENV.
        SYNTHE_LEDGER_HMAC_KEY: ${{ inputs.ledger-hmac-key }}
        SYNTHE_LEDGER_BOOTSTRAP: ${{ inputs.ledger-bootstrap }}
      run: |
        if [ "$HANDOFF_PHASE" = "complete" ]; then
          bash "${{ github.action_path }}/checker/run_complete.sh"
        else
          bash "${{ github.action_path }}/checker/run_check.sh"
        fi
    # A claim phase must persist the ledger even when the check REJECTED:
    # rejections are also recorded state (a failed claim attempt must not
    # reopen the key for a racing retry). Complete phase likewise saves
    # after the flip. Only for the Action-managed ledger.
    #
    # The ledger is initialized with --init-ledger (a sealed genesis chain),
    # not a bare '{}': a cache miss yields a sealed genesis, while any
    # existing file without a valid seal fails closed. Under an anchor, a
    # missing/evicted ledger refuses here with ledger_rollback -- re-run
    # once with ledger-bootstrap: 'true' to re-bootstrap deliberately.
    - name: Ensure handoff ledger file exists
      if: always() && inputs.ledger == ''
      shell: bash
      env:
        SYNTHE_LEDGER_HMAC_KEY: ${{ inputs.ledger-hmac-key }}
        SYNTHE_LEDGER_BOOTSTRAP: ${{ inputs.ledger-bootstrap }}
      run: |
        mkdir -p .synthe
        python3 "${{ github.action_path }}/checker/handoff_check.py" --init-ledger .synthe/ledger.json
    - name: Save handoff ledger
      if: always() && inputs.ledger == ''
      uses: actions/cache/save@v4
      with:
        path: .synthe/ledger.json
        key: synthe-ledger-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.phase }}
    # Publish the new chain head as the out-of-cache anchor, so the next run
    # can tell a fresh cache restore from a stale one. Skipped when the
    # caller supplies their own ledger path or no token. Requires
    # a token with Variables: write (not GITHUB_TOKEN; see README.md).
    - name: Publish ledger anchor
      if: always() && inputs.ledger == '' && inputs.anchor-token != ''
      shell: bash
      env:
        ANCHOR_TOKEN: ${{ inputs.anchor-token }}
      run: |
        set -u
        anchor="$(python3 "${{ github.action_path }}/checker/handoff_check.py" --ledger-head .synthe/ledger.json)"
        if [ -z "$anchor" ]; then
          echo "No sealed ledger chain to anchor (missing/unsealed ledger); skipping."
          exit 0
        fi
        payload="$(python3 -c 'import json,sys; print(json.dumps({"name": "SYNTHE_LEDGER_ANCHOR", "value": sys.argv[1]}))' "$anchor")"
        base="https://api.github.com/repos/${{ github.repository }}/actions/variables"
        code="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
          -H "Authorization: Bearer ${ANCHOR_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" \
          -d "$payload" "$base/SYNTHE_LEDGER_ANCHOR")"
        if [ "$code" = "404" ]; then
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ANCHOR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$payload" "$base")"
        fi
        if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
          echo "::error::Could not publish the ledger anchor (HTTP $code)."
          exit 1
        fi
        echo "Ledger anchor published."
